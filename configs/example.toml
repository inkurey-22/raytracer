[render]
width = 1000
height = 1000

[camera]
fov = 60.0
position = { x = 0.0, y = 1.0, z = -4.0 }
direction = { x = 0.0, y = 0.0, z = 1.0 }

[[lights.omni]]
position = { x = 5.0, y = 5.0, z = 0.0 }
color = { r = 255, g = 255, b = 255 }
intensity = 10

[[lights.ambiant]]
color = { r = 200, g = 200, b = 200 }

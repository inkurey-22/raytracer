color = { r = 0, g = 255, b = 0 }
orientation = { p = 0.0, y = 45.0, r = 0.0 }

[[objects.plane]]
position = { x = 0.0, y = 0.0, z = 0.0 }
normal = { x = 0.0, y = 1.0, z = 0.0 }

[render]
width = 1000
height = 1000

[camera]
fov = 60.0
position = { depth = 4.0, right = 0.0, up = 0.0 }
direction = { depth = -1.0, right = 0.0, up = 0.0 }

[[lights.directional]]
direction = { depth = 0, right = 0, up = -1.0 }
